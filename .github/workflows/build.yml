name: Build OpenMU Server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Server
        working-directory: server/src
        run: dotnet restore Startup/MUnique.OpenMU.Startup.csproj

      - name: Build Server
        working-directory: server/src
        run: dotnet build Startup/MUnique.OpenMU.Startup.csproj --configuration Release --no-restore

      - name: Publish Server
        working-directory: server/src
        run: |
          dotnet publish Startup/MUnique.OpenMU.Startup.csproj \
            --configuration Release \
            --no-build \
            --output ${{ github.workspace }}/publish

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMU-Server-Release
          path: publish/
          if-no-files-found: warn
