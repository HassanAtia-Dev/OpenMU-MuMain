name: Build OpenMU + MuMain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build the main server application instead of the incomplete
      # solution which references test projects not included in this repository.
      - name: Restore Server
        working-directory: server/src
        run: dotnet restore Startup/MUnique.OpenMU.Startup.csproj

      - name: Build Server
        working-directory: server/src
        run: dotnet build Startup/MUnique.OpenMU.Startup.csproj --configuration Release --no-restore


  client:
    name: Client Windows (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Vendored headers (GLEW, turbojpeg, ...) are not shipped in this fork.
      # Pull them from upstream MuMain so source builds can compile.
      - name: Fetch client dependencies from upstream MuMain
        shell: pwsh
        run: |
          $deps = "client/src/dependencies"
          if (-not (Test-Path "$deps/include/gl/glew.h")) {
            Write-Host "Fetching src/dependencies from sven-n/MuMain..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/sven-n/MuMain.git "$env:RUNNER_TEMP/mumain"
            Push-Location "$env:RUNNER_TEMP/mumain"
            git sparse-checkout set src/dependencies
            git checkout
            Pop-Location
            New-Item -ItemType Directory -Force -Path "client/src" | Out-Null
            Copy-Item -Recurse -Force "$env:RUNNER_TEMP/mumain/src/dependencies" "client/src/dependencies"
            Write-Host "Dependencies installed."
            Get-ChildItem -Recurse "client/src/dependencies" | Select-Object -First 20 FullName
          } else {
            Write-Host "dependencies already present, skipping fetch"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup CMake
        uses: lukka/get-cmake@v4.0.3
        with:
          cmakeVersion: '3.31.6'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure Client
        working-directory: client
        shell: pwsh
        run: |
          cmake --preset windows-${{ matrix.arch }}

      - name: Build Client
        working-directory: client
        shell: pwsh
        run: |
          cmake --build --preset windows-${{ matrix.arch }}-release --parallel

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuMain-${{ matrix.arch }}-Release
          path: client/out/build/windows-${{ matrix.arch }}/Release/
          if-no-files-found: warn
