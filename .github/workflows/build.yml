name: Build OpenMU + MuMain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Server
        working-directory: server/src
        run: dotnet restore Startup/MUnique.OpenMU.Startup.csproj

      - name: Build Server
        working-directory: server/src
        run: dotnet build Startup/MUnique.OpenMU.Startup.csproj --configuration Release --no-restore

  client:
    name: Client Windows (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch client dependencies from upstream MuMain
        shell: pwsh
        run: |
          $glew = "client/src/dependencies/include/gl/glew.h"
          if (Test-Path $glew) {
            Write-Host "dependencies already present"
            exit 0
          }
          Write-Host "Downloading dependencies from sven-n/MuMain..."
          $zip = Join-Path $env:RUNNER_TEMP "mumain.zip"
          $out = Join-Path $env:RUNNER_TEMP "mumain-extract"
          Invoke-WebRequest -Uri "https://github.com/sven-n/MuMain/archive/refs/heads/main.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $src = Get-ChildItem $out -Directory | Select-Object -First 1
          $depsSrc = Join-Path $src.FullName "src/dependencies"
          if (-not (Test-Path (Join-Path $depsSrc "include/gl/glew.h"))) {
            Write-Error "Failed to locate src/dependencies in upstream archive"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "client/src" | Out-Null
          Copy-Item -Recurse -Force $depsSrc "client/src/dependencies"
          Write-Host "Installed:"
          Get-ChildItem -Recurse "client/src/dependencies/include" | Select-Object -First 15 FullName

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup CMake
        uses: lukka/get-cmake@v4.0.3
        with:
          cmakeVersion: '3.31.6'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure Client
        working-directory: client
        shell: pwsh
        run: cmake --preset windows-${{ matrix.arch }}

      - name: Build Client
        working-directory: client
        shell: pwsh
        run: cmake --build --preset windows-${{ matrix.arch }}-release --parallel

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuMain-${{ matrix.arch }}-Release
          path: client/out/build/windows-${{ matrix.arch }}/Release/
          if-no-files-found: warn
